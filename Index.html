<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ganesh clone</title>
<style>
  :root{
    --bg:#14110f; --panel:#1d1916; --line:#2c2622; --text:#f3ece4; --muted:#9a8f84;
    --mine:#e8772e; --mine-text:#1a0e05; --theirs:#2a2420;
  }
  *{box-sizing:border-box;margin:0}
  html,body{height:100%}
  body{background:var(--bg);color:var(--text);font:16px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;display:flex;flex-direction:column;max-width:720px;margin:0 auto}
  header{padding:14px 18px;border-bottom:1px solid var(--line);background:var(--panel);display:flex;align-items:center;gap:12px}
  .logo{width:38px;height:38px;border-radius:50%;background:var(--mine);color:var(--mine-text);display:grid;place-items:center;font-weight:700;font-size:18px}
  h1{font-size:18px;font-weight:650}
  .status{font-size:12px;color:var(--muted)}
  #feed{flex:1;overflow-y:auto;padding:16px 14px;display:flex;flex-direction:column;gap:6px}
  .row{display:flex;flex-direction:column;max-width:78%}
  .row.me{align-self:flex-end;align-items:flex-end}
  .row.them{align-self:flex-start;align-items:flex-start}
  .name{font-size:11px;color:var(--muted);margin:6px 8px 2px}
  .bubble{padding:9px 13px;border-radius:18px;white-space:pre-wrap;overflow-wrap:anywhere}
  .me .bubble{background:var(--mine);color:var(--mine-text);border-bottom-right-radius:5px}
  .them .bubble{background:var(--theirs);border-bottom-left-radius:5px}
  .time{font-size:10px;color:var(--muted);margin:2px 8px 0}
  .day{align-self:center;font-size:11px;color:var(--muted);margin:10px 0 4px}
  .empty{margin:auto;text-align:center;color:var(--muted);padding:20px}
  form{display:flex;gap:8px;padding:10px 12px calc(10px + env(safe-area-inset-bottom));border-top:1px solid var(--line);background:var(--panel)}
  textarea{flex:1;resize:none;background:var(--bg);color:var(--text);border:1px solid var(--line);border-radius:20px;padding:10px 14px;font:inherit;max-height:120px;outline:none}
  textarea:focus{border-color:var(--mine)}
  button{background:var(--mine);color:var(--mine-text);border:0;border-radius:20px;padding:0 20px;font:inherit;font-weight:650;cursor:pointer}
  button:disabled{opacity:.4;cursor:default}

  #login{margin:auto;display:flex;flex-direction:column;gap:10px;width:min(320px,90%);padding:20px}
  #login input{background:var(--bg);color:var(--text);border:1px solid var(--line);border-radius:12px;padding:12px;font:inherit;outline:none}
  #login input:focus{border-color:var(--mine)}
  #login button{padding:12px}
  #err{color:#ff8a7a;font-size:13px;min-height:18px}
  .hidden{display:none!important}
</style>
</head>
<body>
<header>
  <div class="logo">G</div>
  <div>
    <h1>Ganesh clone</h1>
    <div class="status" id="status">Connecting…</div>
  </div>
</header>
<div id="login">
  <h2 style="text-align:center">Join the chat</h2>
  <input id="name" placeholder="Your name" maxlength="30" autocomplete="nickname">
  <input id="pass" type="password" placeholder="Passcode" autocomplete="current-password">
  <div id="err"></div>
  <button id="go">Enter</button>
</div>
<div id="feed" class="hidden"></div>
<form id="form" class="hidden">
  <textarea id="input" rows="1" placeholder="Type a message" maxlength="2000" ></textarea>
  <button id="send" type="submit">Send</button>
</form>
